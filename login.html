<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MiniTube Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Şevket Yeşilpekmez - MiniTube Project -->
    <div class="center-page">
        <div class="center-box">
            <h1>MiniTube Login</h1>
            <p class="meta">Example: username <b>ahmet1</b>, password <b>pass1</b></p>
            <p id="loginError" class="error" style="display:none;">Invalid username or password.</p>
            <form action="login.php" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p><a href="index.html">Initialize database again</a></p>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("error") === "1") {
            document.getElementById("loginError").style.display = "block";
        }
    </script>
</body>
</html>
